name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  fonts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Tag, pyproject and package.json agree
        run: |
          py=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          js=$(python -c "import json; print(json.load(open('web/package.json'))['version'])")
          [ "v$py" = "$GITHUB_REF_NAME" ] && [ "v$js" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, pyproject $py, package.json $js"; exit 1; }
      - run: python -m pip install .
      - run: python -m rotulo --out build --web web/fonts
      - name: Release notes from the changelog
        run: awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## \[/ { exit } on' docs/CHANGELOG.md > notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --title "rotulo ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag \
            build/*.ttf web/fonts/*.woff2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - name: npm
        working-directory: web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cp ../README.md ../LICENSE .
          name=$(node -p "require('./package.json').name")
          npm view "$name@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1 || npm publish --provenance --access public

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
